default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: local
    hooks:
      - id: chk
        name: Check project
        entry: bash scripts/quality.sh chk
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: conventional-commit
        name: Check Conventional Commit
        entry: bash scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
        pass_filenames: true
        always_run: true

